name: Каталог версий

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catedra-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Код
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Обновить versions.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-catalog.py

      - name: Закоммитить каталог
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.xml
          if git diff --cached --quiet; then
            echo "Каталог не изменился"
            exit 0
          fi
          git commit -m "Каталог: актуальные версии приложений"
          git push
